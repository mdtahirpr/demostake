<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Properties — DemoStake</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="logo-hex">⬡</span> DemoStake</a>
      <div class="nav-links">
        <a href="properties.html" class="active">Properties</a>
        <a href="how-it-works.html">How it works</a>
        <a href="portfolio.html">Portfolio</a>
      </div>
      <div class="nav-cta">
        <a href="login.html" class="btn-ghost">Sign in</a>
        <a href="signup.html" class="btn-primary">Get started</a>
      </div>
      <button class="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-menu" id="mobile-menu">
      <a href="properties.html">Properties</a>
      <a href="how-it-works.html">How it works</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="login.html">Sign in</a>
      <a href="signup.html" class="btn-primary">Get started</a>
    </div>
  </nav>

  <div class="page-hero sm">
    <div class="container">
      <h1>Browse properties</h1>
      <p>Invest from AED 500 · Fully managed · Shariah-compliant</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <!-- FILTERS -->
      <div class="filters-bar">
        <div class="filter-chips">
          <button class="chip active" onclick="filterProps('all', this)">All</button>
          <button class="chip" onclick="filterProps('dubai', this)">Dubai</button>
          <button class="chip" onclick="filterProps('saudi', this)">Saudi Arabia</button>
          <button class="chip" onclick="filterProps('residential', this)">Residential</button>
          <button class="chip" onclick="filterProps('commercial', this)">Commercial</button>
          <button class="chip" onclick="filterProps('luxury', this)">Luxury</button>
        </div>
        <div class="sort-row">
          <label>Sort by</label>
          <select onchange="sortProps(this.value)">
            <option value="default">Default</option>
            <option value="return-high">Highest return</option>
            <option value="return-low">Lowest return</option>
            <option value="funded-high">Most funded</option>
            <option value="min-low">Lowest minimum</option>
          </select>
        </div>
      </div>
      <p class="results-count" id="results-count">Showing 6 properties</p>
      <!-- GRID -->
      <div class="props-grid" id="props-grid"></div>
    </div>
  </section>

  <footer class="footer mini">
    <div class="footer-bottom">
      <p>© 2025 DemoStake · This is a prototype for demonstration purposes only.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderAllProps();
    function toggleMenu() { document.getElementById('mobile-menu').classList.toggle('open'); }
  </script>
</body>
</html>
